name: Build & Deploy Frontend

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vic777/stock-info-frontend
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile
          platforms: linux/amd64

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: IMAGE_NAME,REPO_URL,GITHUB_SHA
          script: |
            set -euxo pipefail
            IMAGE_REPO="${IMAGE_NAME}"
            IMAGE_DIGEST="${{ steps.build_push.outputs.digest }}"
            IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
            if [ ! -d "${{ secrets.DEPLOY_PATH }}" ]; then
              mkdir -p "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ ! -f ".env" ]; then
              printf 'ALLOWED_ORIGINS=\n# 在此追加后端需要的其他环境变量，如：\n# SOME_API_KEY=\n' > .env
            fi
            pulled=0
            for attempt in 1 2 3 4 5; do
              if docker pull "${IMAGE_REF}"; then
                pulled=1
                break
              fi
            done
            if [ "${pulled}" -ne 1 ]; then
              BUILD_DIR="/tmp/stock-info-frontend-${GITHUB_SHA}"
              rm -rf "${BUILD_DIR}"
              git clone "${REPO_URL}" "${BUILD_DIR}"
              cd "${BUILD_DIR}"
              git checkout "${GITHUB_SHA}"
              docker build --platform linux/amd64 -t "${IMAGE_REPO}:latest" .
              cd "${{ secrets.DEPLOY_PATH }}"
            else
              docker compose pull frontend
            fi
            docker compose up -d --force-recreate frontend
            docker image prune -f


